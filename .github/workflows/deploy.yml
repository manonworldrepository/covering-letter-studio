# Deploy to Google Cloud Run on push
#
# This workflow:
# 1. Authenticates to GCP using OIDC (no service account keys stored in GitHub)
# 2. Builds the Gradle JAR
# 3. Builds the Docker image and pushes to Artifact Registry
# 4. Deploys to Cloud Run
#
# Setup required (see CLOUD_DEPLOYMENT.md for details):
# - Enable Cloud Run, Cloud Build, and Artifact Registry APIs
# - Set up Workload Identity Federation between GitHub and GCP
# - Add GitHub secrets: GCP_PROJECT_ID, GCP_REGION, GCP_SERVICE, WIF_PROVIDER

name: Deploy to Cloud Run

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: ${{ secrets.GCP_SERVICE }}
  REPO_NAME: coveringletter-repo

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Java 25 (Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build JAR with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/coveringletter:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/coveringletter:${{ github.sha }}
          env_vars: GEMINI_MODEL=gemini-3.1-flash-lite
