# Deploy to Google Cloud Run on push
#
# This workflow:
# 1. Authenticates to GCP using OIDC (no service account keys stored in GitHub)
# 2. Builds the Gradle JAR
# 3. Builds the Docker image and pushes to Artifact Registry
# 4. Deploys to Cloud Run
#
# Setup required (see CLOUD_DEPLOYMENT.md for details):
# - Enable Cloud Run, Cloud Build, and Artifact Registry APIs
# - Set up Workload Identity Federation between GitHub and GCP
# - Add GitHub secrets: GCP_PROJECT_ID, GCP_REGION, GCP_SERVICE, WIF_PROVIDER, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GEMINI_API_KEY, CLOUD_STORAGE_BUCKET, JWT_PRIVATE_KEY_BASE64, JWT_PUBLIC_KEY_BASE64

name: Deploy to Cloud Run

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: ${{ secrets.GCP_SERVICE }}
  REPO_NAME: coveringletter-repo

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ env.PROJECT_ID }}
          service_account: coveringletter-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/coveringletter:${GITHUB_SHA}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Artifact Registry returned an invalid image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          echo "image_uri=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/coveringletter@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [[ "$LATEST_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "GitHub ${GITHUB_REF_NAME} advanced to $LATEST_COMMIT before deployment; skipping stale commit $GITHUB_SHA." >&2
            exit 1
          fi

          REVISION="$(gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE_URI" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars "GEMINI_MODEL=gemini-3.1-flash-lite,GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},CLOUD_STORAGE_BUCKET=${{ secrets.CLOUD_STORAGE_BUCKET }},JWT_PRIVATE_KEY_BASE64=${{ secrets.JWT_PRIVATE_KEY_BASE64 }},JWT_PUBLIC_KEY_BASE64=${{ secrets.JWT_PUBLIC_KEY_BASE64 }}" \
            --quiet \
            --format='value(status.latestCreatedRevisionName)')"

          if [[ -z "$REVISION" ]]; then
            echo "Cloud Run did not return the revision created by this deployment." >&2
            exit 1
          fi
          echo "Checking Cloud Run revision $REVISION."

          REVISION_IMAGE="$(gcloud run revisions describe "$REVISION" --region "${REGION}" --project "${PROJECT_ID}" --format='value(spec.containers[0].image)')"
          EXPECTED_REPOSITORY="${IMAGE_URI%@*}"
          REVISION_REPOSITORY="${REVISION_IMAGE%@*}"
          REVISION_DIGEST="${REVISION_IMAGE##*@}"
          if [[ "$REVISION_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Deployed revision $REVISION uses repository $REVISION_REPOSITORY, expected $EXPECTED_REPOSITORY." >&2
            exit 1
          fi

          if [[ "$REVISION_DIGEST" != "${IMAGE_URI##*@}" ]]; then
            PLATFORM_DIGESTS="$(docker buildx imagetools inspect --raw "$IMAGE_URI" | jq -r '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
            if ! grep -Fxq "$REVISION_DIGEST" <<< "$PLATFORM_DIGESTS"; then
              echo "Deployed revision $REVISION uses digest $REVISION_DIGEST, which is not the pushed image digest ${IMAGE_URI##*@} or its Linux/AMD64 manifest." >&2
              exit 1
            fi
          fi

          TRAFFIC_PERCENT="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format=json | jq -r --arg revision "$REVISION" '[.status.traffic[]? | select(.revisionName == $revision) | (.percent // 0)] | add // 0')"
          if [[ "$TRAFFIC_PERCENT" != "100" ]]; then
            echo "Revision $REVISION receives ${TRAFFIC_PERCENT}% of traffic; expected 100%." >&2
            exit 1
          fi
          LATEST_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [[ "$LATEST_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "GitHub ${GITHUB_REF_NAME} advanced to $LATEST_COMMIT during deployment; this run deployed $GITHUB_SHA. The newer push run must deploy the current commit." >&2
            exit 1
          fi
          echo "Verified $REVISION is serving $IMAGE_URI with 100% of traffic for latest commit $LATEST_COMMIT."
