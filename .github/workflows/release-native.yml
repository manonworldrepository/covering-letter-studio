name: Native release builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-build:
    name: Build ${{ matrix.name }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact_name: coveringletter-windows-x64
            binary_path: build/native/nativeCompile/coveringletter.exe
            package_name: coveringletter-windows-x64.zip
          - os: ubuntu-latest
            name: linux
            artifact_name: coveringletter-linux-x64
            binary_path: build/native/nativeCompile/coveringletter
            package_name: coveringletter-linux-x64.tar.gz
          - os: macos-latest
            name: macos
            artifact_name: coveringletter-macos-x64
            binary_path: build/native/nativeCompile/coveringletter
            package_name: coveringletter-macos-x64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM and Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build native executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat nativeCompile --no-daemon

      - name: Build native executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew nativeCompile --no-daemon

      - name: Package native executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.binary_path }}" -Destination "dist/coveringletter.exe"
          Compress-Archive -Path "dist/coveringletter.exe" -DestinationPath "${{ matrix.package_name }}" -Force

      - name: Package native executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" dist/coveringletter
          chmod +x dist/coveringletter
          tar -czf "${{ matrix.package_name }}" -C dist coveringletter

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.package_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: native-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
          generate_release_notes: true

