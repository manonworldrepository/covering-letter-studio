spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: default
  application:
    name: coveringletter
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: ASYNC
        annotation-scanner:
          enabled: true
  webflux:
    multipart:
      max-in-memory-size: 30MB
      max-disk-usage-per-part: 10MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: "https://coveringletter-ga7tig2oka-uc.a.run.app/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com

web:
  error:
    include-message: always

logging:
  level:
    org.apache.pdfbox.pdmodel.font.PDSimpleFont: ERROR
    org.apache.pdfbox.pdmodel.font.PDType0Font: ERROR
    org.apache.fontbox.ttf.PostScriptTable: ERROR

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

coverletter:
  storage:
    directory: ${COVERLETTER_STORAGE_DIR:.data}
  security:
    allowed-emails: ${ALLOWED_EMAILS:info@manonworld.de}

server:
  address: 127.0.0.1
