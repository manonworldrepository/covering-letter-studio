spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: default
  application:
    name: coveringletter
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: ASYNC
        annotation-scanner:
          enabled: true
  webflux:
    multipart:
      max-in-memory-size: 30MB
      max-disk-usage-per-part: 10MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
              - openid
            authorization-grant-type: authorization_code
            redirect-uri: "https://coveringletter-ga7tig2oka-uc.a.run.app/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com
            user-name-attribute: email

web:
  error:
    include-message: always

logging:
  level:
    root: WARN
    com.mosta.coveringletter.security.JwtService: WARN
    com.mosta.coveringletter.aspects: WARN
    org.apache.pdfbox.pdmodel.font.PDSimpleFont: ERROR
    org.apache.pdfbox.pdmodel.font.PDType0Font: ERROR
    org.apache.fontbox.ttf.PostScriptTable: ERROR

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

coverletter:
  storage:
    directory: ${COVERLETTER_STORAGE_DIR:.data}
  security:
    allowed-emails: ${ALLOWED_EMAILS:info@manonworld.de}
  cloud-storage:
    enabled: ${CLOUD_STORAGE_ENABLED:false}
    bucket: ${CLOUD_STORAGE_BUCKET:}
  jwt:
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 604800
    # Shared RSA key pair for Cloud Run multi-instance deployment.
    # When set, all instances use the same key so JWT tokens are valid across instances.
    # Generate with: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
    #               openssl pkey -in jwt-private.pem -pubout -out jwt-public.pem
    # Then base64-encode both files and set the environment variables below.
    # If not set, a random key pair is generated at startup (works for single-instance only).
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}

server:
  address: 127.0.0.1
