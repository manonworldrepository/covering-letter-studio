<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3158d5">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Cover Letter Studio — Initial setup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #3158d5; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    main { width: min(100%, 600px); padding: 40px; border-radius: 14px; background: #fff; box-shadow: 0 8px 32px #17203330; }
    .logo { margin-bottom: 12px; font-size: 40px; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { color: #657087; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 24px 0 8px; font-size: 14px; font-weight: 650; }
    input { width: 100%; min-width: 0; padding: 12px; border: 1px solid #cbd3e1; border-radius: 8px; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #3158d555; outline-offset: 2px; }
    .email-fields { display: grid; gap: 10px; }
    .email-row { display: flex; align-items: center; gap: 8px; }
    .email-row button { width: auto; flex: 0 0 auto; }
    .secondary { border: 1px solid #cbd3e1; background: #fff; color: #172033; }
    .secondary:hover { background: #f2f5fb; }
    .actions { display: flex; gap: 10px; margin-top: 12px; }
    .actions button { width: auto; flex: 1; }
    .hint { margin: 8px 0 20px; font-size: 12px; }
    button { width: 100%; padding: 12px 16px; border: 0; border-radius: 8px; background: #3158d5; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #2448bd; }
    button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 22px; margin: 14px 0 0; font-size: 14px; }
    .status.error { color: #ad2938; }
    @media (max-width: 520px) { main { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">📝</div>
    <h1>Set up allowed accounts</h1>
    <p>Choose the Google account email address or addresses permitted to sign in to this app. This one-time setup saves them to the local <code>.env</code> file.</p>
    <form id="setup-form">
      <label>Allowed email addresses</label>
      <div id="email-fields" class="email-fields"></div>
      <div class="actions">
        <button class="secondary" id="add-email" type="button">Add email</button>
        <button class="secondary" id="clear-emails" type="button">Remove all</button>
      </div>
      <p class="hint">Add one address per field. Only these accounts will be able to sign in.</p>
      <button id="save-button" type="submit">Save and continue to sign in</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('setup-form');
    const button = document.getElementById('save-button');
    const status = document.getElementById('status');
    const emailFields = document.getElementById('email-fields');

    function addEmailField(value = '') {
      const row = document.createElement('div');
      row.className = 'email-row';
      const input = document.createElement('input');
      input.type = 'email';
      input.name = 'emails';
      input.autocomplete = 'email';
      input.required = true;
      input.maxLength = 320;
      input.placeholder = 'you@gmail.com';
      input.setAttribute('aria-label', 'Allowed email address');
      input.value = value;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'secondary';
      remove.textContent = 'Remove';
      remove.setAttribute('aria-label', 'Remove email field');
      remove.addEventListener('click', () => row.remove());
      row.append(input, remove);
      emailFields.append(row);
      input.focus();
    }

    document.getElementById('add-email').addEventListener('click', () => addEmailField());
    document.getElementById('clear-emails').addEventListener('click', () => {
      emailFields.replaceChildren();
      addEmailField();
    });
    addEmailField();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const emails = Array.from(emailFields.querySelectorAll('input'))
        .map((input) => input.value.trim())
        .filter(Boolean);
      if (emails.length === 0) {
        status.className = 'status error';
        status.textContent = 'Add at least one allowed email address.';
        return;
      }
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Saving allowed accounts…';

      try {
        const response = await fetch('/api/setup/allowed-emails', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emails: emails.join(',') })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Could not save allowed accounts.');
        window.location.replace('/login');
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Could not save allowed accounts. Check that the .env file is writable.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
